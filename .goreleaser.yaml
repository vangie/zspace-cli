version: 2

project_name: zspace-cli

builds:
  - id: zspace
    main: ./cmd/zspace
    binary: zspace
    ldflags:
      - -s -w -X github.com/vangie/zspace-cli/internal/cli.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
  - id: zspace-mcp
    main: ./cmd/zspace-mcp
    binary: zspace-mcp
    ldflags:
      - -s -w -X github.com/vangie/zspace-cli/internal/mcp.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    ids: [zspace, zspace-mcp]
    name_template: "zspace_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

homebrew_casks:
  - name: zspace-cli
    binaries:
      - zspace
      - zspace-mcp
    # 没有 tap token 时只在 dist 里生成配方，不推仓库。
    skip_upload: '{{ not (isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN") }}'
    repository:
      owner: vangie
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "missing" }}'
    directory: Casks
    homepage: https://github.com/vangie/zspace-cli
    description: 极空间 NAS 的命令行与 MCP 服务

