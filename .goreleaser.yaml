version: 2

project_name: zspace-cli

builds:
  - id: zspace
    main: ./cmd/zspace
    binary: zspace
    ldflags:
      - -s -w -X github.com/vangie/zspace-cli/internal/cli.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
  - id: zspace-mcp
    main: ./cmd/zspace-mcp
    binary: zspace-mcp
    ldflags:
      - -s -w -X github.com/vangie/zspace-cli/internal/mcp.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    ids: [zspace, zspace-mcp]
    name_template: "zspace_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  header: '{{ readFile ".release-notes.md" }}'

# 继续发 Formula，现有的 brew install vangie/tap/zspace-cli 不用改。
# brews 在 2.18 已标记弃用，但 homebrew_casks 会改成 cask，和现在的安装方式不一致。
brews:
  - name: zspace-cli
    repository:
      owner: vangie
      name: homebrew-tap
      git:
        url: git@github.com:vangie/homebrew-tap.git
        private_key: '{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}'
    directory: Formula
    homepage: https://github.com/vangie/zspace-cli
    description: 极空间 NAS 的命令行与 MCP 服务
    install: |
      bin.install "zspace"
      bin.install "zspace-mcp"
    test: |
      system "#{bin}/zspace", "version"

