name: release
# 发版：在 CHANGELOG.md 写好对应版本，提交后打 vX.Y.Z 并推送。
# 本 workflow 从 CHANGELOG 取出这一节，作为 GitHub Release 说明。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 同一标签只跑一个发布。旧任务被取消时不会删掉已经创建的 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: test
        run: go test ./...
      - name: release notes
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v tag="$tag" '
            index($0, "## [" tag "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q . "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md 里没有 [$tag] 这一节，发布中止" >&2
            exit 1
          fi
          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN 不能写 homebrew-tap。用只写该仓库的 deploy key。
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
